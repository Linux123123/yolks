name: build cockroach with TiKV

on:
  workflow_dispatch:
    inputs:
      activate_existing_tag:
        description: "Retag the tested pinned TiKV image as cockroach_latest"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - cockroach/**
      - .github/workflows/cockroach.yml

jobs:
  push:
    name: "CockroachDB + PD/TiKV ${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: ${{ !inputs.activate_existing_tag }}
      - uses: docker/setup-buildx-action@v3
      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: ${{ !inputs.activate_existing_tag }}
        with:
          context: ./cockroach
          file: ./cockroach/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/linux123123/linux123123:cockroach_tikv_v8.5.6
            ghcr.io/linux123123/linux123123:cockroach_tikv_${{ github.sha }}
      - name: Activate existing Apollo image tag
        if: ${{ inputs.activate_existing_tag }}
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/linux123123/linux123123:cockroach_latest
          ghcr.io/linux123123/linux123123@sha256:bd01dd744e14b03bb4ceb1302a862f48fd406914908aeba1e42ca5793fc173be
